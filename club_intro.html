    <h1>打击乐社活动详情介绍</h1>
    <img src="drum.jpg" alt="打击乐活动照片">
    <p>打击乐社每学期会开展多类活动：零基础公开课、社员日常排练、校园晚会演出、节奏分享会。</p>
    <p>零基础公开课面向所有新社员，从握棒姿势、基础节拍开始教学，不需要任何乐理基础。日常排练分组进行，大家组队排练合奏曲目，为晚会节目做准备。</p>
    <p>社团配有架子鼓、卡洪鼓、小军鼓等打击乐器，社员可以在固定时间段预约排练室练习。</p>
    <p>每学期我们都会登上校园舞台，在迎新晚会、校园音乐节进行表演，体验舞台演奏的快乐。</p>
